name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC.
    #
    # 7:30 PM America/Chicago (CDT, UTC-5)  => 00:30 UTC next day
    # 7:30 PM America/Chicago (CST, UTC-6)  => 01:30 UTC next day
    #
    # We schedule both and select the matching UTC offset. The guard uses the
    # triggering cron expression rather than the runner clock because GitHub
    # may start scheduled workflows minutes or hours late.
    - cron: "30 0 * * 2-6" # Tue-Sat UTC => Mon-Fri local
    - cron: "30 1 * * 2-6" # Tue-Sat UTC => Mon-Fri local

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  should-deploy:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.schedule-check.outputs.run }}
    steps:
      - name: Check scheduled deploy time
        id: schedule-check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chicago_offset="$(TZ=America/Chicago date +%z)"
          scheduled_cron="${{ github.event.schedule }}"

          if [[ "$scheduled_cron" == "30 0 * * 2-6" && "$chicago_offset" == "-0500" ]] ||
             [[ "$scheduled_cron" == "30 1 * * 2-6" && "$chicago_offset" == "-0600" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=false" >> "$GITHUB_OUTPUT"

  build:
    needs: should-deploy
    if: needs.should-deploy.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate static data
        run: npm run generate:pages-data

      - name: Unit tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build static export
        run: node scripts/build-pages.mjs

      - name: Static-export smoke test
        run: npm run test:static

      - name: Auto-commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git diff --quiet public/data/; then
            echo "No data changes; skipping commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "chore(data): refresh $(date -u +%Y-%m-%d) [skip ci]"
          if ! git push origin HEAD:main; then
            echo "::error::Validated data could not be pushed to main; deployment stopped"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
